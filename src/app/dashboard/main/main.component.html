<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Dashboard'" [items]="['Inicio']" [active_item]="'Dashboard'"></app-breadcrumb>
    </div>

    <div class="container-fluid">
      <!-- Tarjetas resumen -->
      <div class="row">
        <!-- Ventas -->
        <div class="col-lg-4 col-sm-6">
          <div class="info-box7 l-bg-card2 order-info-box7">
            <div class="info-box7-block">
              <h4 class="m-b-20">Ventas</h4>
              <h2 class="text-end">
                <i class="fas fa-cart-plus float-start"></i><span>{{datos?.ventas}}</span>
              </h2>
            </div>
          </div>
        </div>

        <!-- Clientes -->
        <div class="col-lg-4 col-sm-6">
          <div class="info-box7 l-bg-orange order-info-box7">
            <div class="info-box7-block">
              <h4 class="m-b-20">Clientes</h4>
              <h2 class="text-end">
                <i class="fas fa-users float-start"></i><span>{{datos?.clientes}}</span>
              </h2>
            </div>
          </div>
        </div>

        <!-- Productos -->
        <div class="col-lg-4 col-sm-6">
          <div class="info-box7 l-bg-card1 order-info-box7">
            <div class="info-box7-block">
              <h4 class="m-b-20">Productos</h4>
              <h2 class="text-end">
                <i class="fas fa-box float-start"></i><span>{{datos?.productos}}</span>
              </h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Gráficos -->
      <div class="row dashboard-grid mt-4">

        <!-- Top productos más vendidos -->
        <div class="col-lg-6 col-md-12">
          <div class="body">
            <h4>Top productos más vendidos (torta)</h4>
            <div *ngIf="pieChartDataMasVendidos.labels?.length">
              <canvas baseChart
                      [data]="pieChartDataMasVendidos"
                      [options]="pieChartOptions"
                      [type]="'pie'">
              </canvas>
            </div>
          </div>
        </div>

        <!-- Productos agotados -->
        <div class="col-lg-6 col-md-12">
          <div class="body">
            <h4>Productos agotados</h4>
          <div *ngIf="barChartDataAgotados.labels?.length">
  <canvas baseChart
          [data]="barChartDataAgotados"
          [options]="barChartOptionsAgotados"
          chartType="'bar'">
  </canvas>
</div>
          </div>
        </div>

        <!-- Ventas por vendedor -->
        <div class="col-lg-6 col-md-12">
          <div class="body">
            <h4>Ventas por vendedor</h4>
            <div *ngIf="lineChartDataVentas.labels?.length">
              <canvas baseChart
                      [data]="lineChartDataVentas"
                      [options]="lineChartOptions"
                      chartType="line">
              </canvas>
            </div>
          </div>
        </div>

        <!-- Venta por categoría -->
        <div class="col-lg-6 col-md-12">
          <div class="body">
            <h4>Venta de productos por categoría</h4>
            <div *ngIf="lineChartDataCategorias.labels?.length">
              <canvas baseChart
                      [data]="lineChartDataCategorias"
                      [options]="lineChartOptions"
                      chartType="line">
              </canvas>
            </div>
          </div>
        </div>

        <!-- Predicción de ventas (Tableau) -->
        <div class="col-lg-12 col-md-12">
          <div class="card">
            <div class="body">
              <h4 class="text-center">Predicción de ventas mensuales (Tableau)</h4>
              <app-grafico-tableau></app-grafico-tableau>
            </div>
          </div>
        </div>

        <!-- Predicción y comparativa -->
        <div class="row">
          <!-- Predicción de ventas -->
          <div class="col-lg-6 col-md-12">
            <div class="card">
              <div class="body">
                <app-grafico-prediccion></app-grafico-prediccion>
              </div>
            </div>
          </div>

          <!-- Comparativa mensual -->
          <div class="col-lg-6 col-md-12">
            <div class="card">
              <div class="body">
                <h5 class="text-center mb-2">Comparativa de ventas: Mes actual vs anterior</h5>
                <app-grafico-comparativa></app-grafico-comparativa>
              </div>
            </div>
          </div>
        </div> <!-- Fin row interna -->

      </div> <!-- Fin dashboard-grid -->
    </div> <!-- Fin container-fluid -->
  </div> <!-- Fin content-block -->
</section>
